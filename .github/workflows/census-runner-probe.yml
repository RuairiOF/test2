name: Census Runner Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.census-runner-probe'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python --version
          curl --fail --location --max-time 30 https://www.shopify.com/ -o /dev/null
          echo ready > runner-ready.txt
      - uses: actions/upload-artifact@v4
        with:
          name: census-runner-ready
          path: runner-ready.txt
