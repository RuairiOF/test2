name: Issue Actions Probe

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner availability
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "ACTIONS_PROBE_OK $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
