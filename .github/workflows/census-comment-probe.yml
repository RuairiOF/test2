name: Census Comment Probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/run-census-probe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: network
        shell: bash
        run: |
          set -e
          python --version
          curl --fail --location --max-time 30 https://www.shopify.com/ -o /dev/null
          echo ready > runner-ready.txt
      - uses: actions/upload-artifact@v4
        with:
          name: census-comment-runner-ready
          path: runner-ready.txt
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'CENSUS_RUNNER_READY'
            })
