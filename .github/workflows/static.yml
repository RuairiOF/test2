name: Public Census Runner

on:
  push:
    branches: [main]
    paths:
      - '.run-public-census'
      - '.github/workflows/static.yml'
  pull_request:
    branches: [main]
    paths:
      - '.run-public-census-pr'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runner_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify outbound access and record runner state
        run: |
          python --version
          curl --fail --location --max-time 30 https://www.shopify.com/ -o /dev/null
          mkdir -p runtime
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          payload = {
              'status': 'ready',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'started_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          Path('runtime/public-census-runner.json').write_text(json.dumps(payload, indent=2))
          print(json.dumps(payload, indent=2))
          PY
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            git config user.name 'eirlink-census-runner'
            git config user.email 'actions@users.noreply.github.com'
            git add runtime/public-census-runner.json
            git commit -m 'state: public census runner ready' || exit 0
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: public-runner-probe
          path: runtime/public-census-runner.json
